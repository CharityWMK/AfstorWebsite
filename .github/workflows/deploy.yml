name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  BRANCH: ${{ github.ref_name }}
  REPO_PATH: ${{ github.ref_name == 'main' && '/home/zpnitnzt/website/afstor.co.ke' || '/home/zpnitnzt/website/staging.afstor.co.ke' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update from Remote
        run: |
          response=$(curl -sS -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update?repository_root=${REPO_PATH}&branch=${BRANCH}")
          echo "$response"
          echo "$response" | grep -q '"status":1'

      - name: Deploy HEAD Commit
        run: |
          sleep 5
          response=$(curl -sS -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create?repository_root=${REPO_PATH}")
          echo "$response"
          echo "$response" | grep -q '"status":1'
